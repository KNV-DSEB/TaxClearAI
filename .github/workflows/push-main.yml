# .github/workflows/push-main.yml
#
# Skipped entirely for app-fe-only (no Dockerfile/backend to build — see
# 08-INIT-SCRIPT-SPEC.md generate_ci(), this file is not copied for that type).
# Actions pinned to commit SHA — see pr-check.yml header comment for policy.
name: Build, Scan & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ─── Resolve lowercase owner/repo image name (GHCR requires the full
  # ─── namespace and rejects uppercase — github.repository_owner can be
  # ─── mixed-case, so it must be lowercased in a shell step) ──────────
  prepare:
    name: Resolve Image Name
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.image-name.outputs.value }}
    steps:
      - name: Compute lowercase image name
        id: image-name
        run: echo "value=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  # ─── Build Docker image (local, for scanning before push) ──
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [prepare]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build image (local for scanning)
        run: |
          docker build \
            -f backend/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ./backend

      - name: Save image as artifact for downstream jobs
        run: docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-${{ github.sha }}
          path: image.tar
          retention-days: 1

  # ─── Trivy scan ────────────────────────────────────────────
  trivy-scan:
    name: Trivy Image + Config Scan
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image-${{ github.sha }}

      - name: Load image
        run: docker load -i image.tar

      - name: Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-image.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy Dockerfile misconfig scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "config"
          scan-ref: "./backend/Dockerfile"
          format: "sarif"
          output: "trivy-config.sarif"
        if: always()

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "cyclonedx"
          output: "sbom.cyclonedx.json"
        if: always()

      # No upload-sarif (GHAS billed per committer/month on this private repo)
      - name: Upload Trivy reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-reports-${{ github.sha }}
          path: |
            trivy-image.sarif
            trivy-config.sarif
        if: always()

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
        if: always()

  # ─── Push image to registry ───────────────────────────────
  push-image:
    name: Push Image to Registry
    runs-on: ubuntu-latest
    needs: [prepare, build, trivy-scan]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to staging ────────────────────────────────────
  # TODO: enable once a real staging server exists — "Deploy" is a placeholder
  # echo and the health check always fails with nothing listening at STAGING_URL.
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [prepare, push-image]
    environment: staging
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
    if: false
    steps:
      - name: Deploy
        run: |
          # Replace with your actual deploy command
          # e.g., kubectl set image, fly deploy, railway up, ssh + docker-compose pull...
          echo "Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} to staging"

      - name: Health check
        run: |
          sleep 30
          curl --fail "${{ vars.STAGING_URL }}/health" || exit 1

  # ─── ZAP DAST after staging deploy (advisory, non-blocking) ─
  # TODO: enable together with deploy-staging above
  dast-zap:
    name: DAST – OWASP ZAP
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: ZAP Baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "${{ vars.STAGING_URL }}"
          rules_file_name: ".zap/rules.tsv"
          fail_action: false # advisory only, does not block

      - name: Upload ZAP report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-report-${{ github.sha }}
          path: report_html.html
        if: always()
