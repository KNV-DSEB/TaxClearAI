# .github/workflows/pr-check.yml
#
# Actions pinned to commit SHA (not @main/@v-tag) per VibeCraft's supply-chain
# policy — see plans/04-security-hooks-cicd.md. Version in the trailing comment
# is what the SHA corresponds to; bump both together, never the tag alone.
name: PR Check

on:
  push:
    branches: ["feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.14"

jobs:
  # ─── Gitleaks secret scan ─────────────────────────────────
  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history, gitleaks needs it

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Backend lint + type-check + test (TypeScript) ────────
  backend-ts-quality:
    name: Backend TS Quality
    runs-on: ubuntu-latest
    if: ${{ vars.PROJECT_TYPE != 'app-fe-only' && vars.BACKEND_LANG == 'typescript' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Run tests
        run: pnpm test:cov
        env:
          NODE_ENV: test

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-ts-coverage
          path: backend/coverage/

  # ─── Backend lint + type-check + test (Python) ────────────
  backend-python-quality:
    name: Backend Python Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tax_clear_ci
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: tax_clear_ai_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U tax_clear_ci -d tax_clear_ai_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://tax_clear_ci:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/tax_clear_ai_test
      TEST_DATABASE_URL: postgresql+asyncpg://tax_clear_ci:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/tax_clear_ai_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy type check
        run: mypy src/

      - name: Prepare isolated test database and signing key
        run: |
          python - <<'PY'
          import os
          import secrets
          value = secrets.token_urlsafe(48)
          print("::add-mask::" + value)
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write("JWT_SECRET_KEY=" + value + "\n")
          PY
          python -m alembic upgrade head

      - name: Run tests with coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report --fail-under=80
          python -m coverage xml

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-python-coverage
          path: backend/coverage.xml

  # ─── Frontend lint + test (fullstack AND fe-only) ─────────
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Run tests
        run: pnpm test:cov

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Build check
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_BASE_URL || 'http://localhost:8000' }}

  # ─── Semgrep SAST (offline CLI — no third-party Action) ───
  sast-semgrep:
    name: SAST – Semgrep
    runs-on: ubuntu-latest
    needs: [secrets-scan]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Semgrep scan
        run: |
          pip install semgrep
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/jwt \
            --sarif --output semgrep.sarif \
            .
        continue-on-error: true

      # No upload-sarif (GHAS billed per committer/month on this private repo)
      - name: Upload Semgrep report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-report
          path: semgrep.sarif
        if: always()

  # ─── Quality gate summary ─────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - sast-semgrep
      - backend-python-quality
      - frontend-quality
    if: always()
    steps:
      - name: Check required jobs passed
        run: |
          if [[ "${{ needs.secrets-scan.result }}" != "success" ]]; then
            echo "Secret scan failed – merge blocked"; exit 1
          fi
          if [[ "${{ needs.backend-python-quality.result }}" != "success" || "${{ needs.frontend-quality.result }}" != "success" ]]; then
            echo "Python/frontend checks failed or were skipped - merge blocked"; exit 1
          fi
          echo "All required quality gates passed"
