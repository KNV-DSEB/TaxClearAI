[project]
name = "tax-clear-ai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.3",
  "sqlalchemy[asyncio]==2.0.52",
  "asyncpg==0.32.0",
  "alembic==1.19.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "python-jose[cryptography]==3.5.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==5.0.0",
  "python-multipart==0.0.32",
  "structlog==26.1.0",
  "httpx==0.28.1"
]

[tool.vercel]
entrypoint = "src.main:app"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "ASYNC" # flake8-async
]
ignore = ["B008"] # FastAPI's Depends() in defaults triggers this, it's intentional

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions", ".venv"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/alembic/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
