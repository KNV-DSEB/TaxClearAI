<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Tax Clear"><title>Tax Clear</title><style>.mk-shield,.mk-fold{transform-box:fill-box;transform-origin:center bottom;animation:shield .6s cubic-bezier(.2,.8,.2,1) both}.mk-c{transform-box:fill-box;transform-origin:center;animation:sweep .7s cubic-bezier(.2,.8,.2,1) .25s both}.mk-tick{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .45s ease-out .8s forwards}@keyframes shield{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}@keyframes sweep{from{opacity:0;transform:rotate(-120deg) scale(.6)}to{opacity:1;transform:none}}@keyframes draw{to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.mk-shield,.mk-fold,.mk-c{animation:none}.mk-tick{animation:none;stroke-dashoffset:0}}</style><g transform="scale(.5)"><defs><linearGradient id="tca-d" x1="20" y1="8" x2="64" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#18a885"/><stop offset="1" stop-color="#0a3a33"/></linearGradient><linearGradient id="tca-l" x1="64" y1="8" x2="108" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5ff0c0"/><stop offset="1" stop-color="#128c71"/></linearGradient><linearGradient id="tca-y" x1="30" y1="30" x2="100" y2="100" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffd987"/><stop offset=".55" stop-color="#f7a535"/><stop offset="1" stop-color="#e2771a"/></linearGradient><clipPath id="tca-c"><path d="M64 8L90 15.5L108 33V60C108 90 90 109 64 120C38 109 20 90 20 60V21Z"/></clipPath><filter id="tca-sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#06302a" flood-opacity=".45"/></filter></defs><path class="mk-shield" d="M64 8L90 15.5L108 33V60C108 90 90 109 64 120C38 109 20 90 20 60V21Z" fill="url(#tca-d)"/><g class="mk-shield" clip-path="url(#tca-c)"><rect x="64" y="0" width="64" height="128" fill="url(#tca-l)"/></g><path class="mk-fold" d="M90 15.5L108 33L93 31Z" fill="#c9f0e2"/><path class="mk-c" d="M89.50 41.24A37 37 0 1 0 89.50 90.76L86.21 80.79A20 20 0 1 1 86.21 51.21Z" fill="url(#tca-y)" filter="url(#tca-sh)"/><path class="mk-tick" d="M52 64L61 73L84 50" pathLength="1" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
